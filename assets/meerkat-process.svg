  <defs>
    <style id="meerkat-animation">
      #tail {
        transform-box: view-box;
        transform-origin: 350px 410px;
        animation: tail-wag 3.8s ease-in-out infinite;
      }
      #building-arm {
        transform-box: view-box;
        transform-origin: 402px 185px;
        animation: build-sandcastle 2.8s ease-in-out infinite;
      }
      #head {
        transform-box: view-box;
        transform-origin: 405px 70px;
        animation: head-move 7s ease-in-out infinite;
      }
      @keyframes tail-wag {
        0%, 100% { transform: rotate(0deg); }
        25% { transform: rotate(-7deg); }
        50% { transform: rotate(5deg); }
        75% { transform: rotate(-4deg); }
      }
      @keyframes build-sandcastle {
        0%, 15%, 100% { transform: rotate(0deg); }
        30% { transform: rotate(7deg); }
        45% { transform: rotate(-5deg); }
        60% { transform: rotate(6deg); }
        75% { transform: rotate(0deg); }
      }
      @keyframes head-move {
        0%, 18%, 100% { transform: rotate(0deg) translate(0, 0); }
        24% { transform: rotate(-4deg) translate(-2px, 1px); }
        30% { transform: rotate(3deg) translate(2px, 0); }
        36% { transform: rotate(0deg) translate(0, 0); }
        62% { transform: rotate(0deg) translate(0, 0); }
        68% { transform: rotate(4deg) translate(2px, 1px); }
        74% { transform: rotate(-2deg) translate(-1px, 0); }
        80% { transform: rotate(0deg) translate(0, 0); }
      }
      @media (prefers-reduced-motion: reduce) {
        #tail, #building-arm, #head { animation: none; }
      }
    </style>
