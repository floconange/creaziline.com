      /* --- Creaziline meerkat animation --- */

      #body {
        transform-box: fill-box;
        transform-origin: center bottom;
        animation: meerkat-breathe 3.2s ease-in-out infinite;
      }

      #nose {
        transform-box: fill-box;
        transform-origin: center center;
        animation: meerkat-sniff 4.5s ease-in-out infinite;
      }

      #tail {
        transform-box: fill-box;
        transform-origin: 0% 50%;
        animation: meerkat-tail 2.8s ease-in-out infinite;
      }

      @keyframes meerkat-breathe {
        0%, 100% {
          transform: scaleY(1);
        }
        50% {
          transform: scaleY(1.025);
        }
      }

      @keyframes meerkat-sniff {
        0%, 68%, 100% {
          transform: scale(1);
        }
        72% {
          transform: scale(1.09);
        }
        75% {
          transform: scale(1);
        }
        78% {
          transform: scale(1.06);
        }
        81% {
          transform: scale(1);
        }
      }

      @keyframes meerkat-tail {
        0%, 100% {
          transform: rotate(-3deg);
        }
        25% {
          transform: rotate(5deg);
        }
        50% {
          transform: rotate(-1deg);
        }
        75% {
          transform: rotate(7deg);
        }
      }

      @media (prefers-reduced-motion: reduce) {
        #body,
        #nose,
        #tail {
          animation: none;
        }
      }
    </style>
